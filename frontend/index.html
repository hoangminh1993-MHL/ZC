<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZC Operations</title>
    <link rel="icon" type="image/jpeg" href="/uploads/logo.jpg">
    
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#A10416',
                            cream: '#F6F0E2',
                            text: '#27221F',
                            green: '#22c55e',
                            orange: '#f97316',
                            error: '#ef4444'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-brand-cream text-brand-text font-sans antialiased flex flex-col md:flex-row min-h-screen">
    
    <!-- Sidebar for PC -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 h-screen sticky top-0">
        <div class="p-6 flex items-center gap-3">
            <img src="/uploads/logo.jpg" alt="Logo" class="w-10 h-10 rounded-full object-cover">
            <h1 class="font-bold text-lg text-brand-red truncate">ZC Operations</h1>
        </div>
        
        <nav class="flex-1 px-4 space-y-1 overflow-y-auto" id="pc-nav">
            <!-- Nav items injected by JS based on role -->
        </nav>
        
        <div class="p-4 border-t border-gray-200">
            <div class="flex items-center gap-3 mb-4 cursor-pointer" onclick="showProfile()">
                <div class="w-10 h-10 rounded-full bg-gray-200 flex-shrink-0 overflow-hidden">
                    <img id="userAvatar" src="" class="w-full h-full object-cover">
                </div>
                <div class="overflow-hidden">
                    <p id="userName" class="text-sm font-medium truncate"></p>
                    <p id="userRole" class="text-xs text-gray-500 truncate"></p>
                </div>
            </div>
            <button onclick="logout()" class="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-md transition-colors">
                <i class="fas fa-sign-out-alt w-5"></i> Đăng xuất
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <!-- Mobile Header -->
        <header class="md:hidden bg-white border-b border-gray-200 h-14 flex items-center justify-between px-4 flex-shrink-0 sticky top-0 z-10">
            <div class="flex items-center gap-2">
                <img src="/uploads/logo.jpg" alt="Logo" class="w-8 h-8 rounded-full object-cover">
                <h1 class="font-bold text-brand-red" id="mobile-header-title">Hôm nay</h1>
            </div>
            <div class="flex items-center gap-3">
                <button class="text-gray-500 relative" onclick="openNotifications()">
                    <i class="far fa-bell text-xl"></i>
                    <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-brand-red rounded-full hidden" id="notif-badge"></span>
                </button>
            </div>
        </header>

        <!-- Dynamic Content -->
        <div id="app-content" class="flex-1 overflow-y-auto p-4 md:p-8 pb-20 md:pb-8 bg-brand-cream/50">
            <div class="flex items-center justify-center h-full">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-red"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation for Mobile -->
    <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-between px-2 pb-safe pt-1 z-20" id="mobile-nav">
        <!-- Nav items injected by JS -->
    </nav>

    <!-- Global Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>
    
    <!-- Global Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto animate-fade-in" id="modal-content">
            <!-- Modal injected by JS -->
        </div>
    </div>

    <!-- App Logic -->
    <script src="app.js"></script>
    <script src="views/dashboard.js"></script>
    <script src="views/kitchen.js"></script>
    <script src="views/orders.js"></script>
    <script src="views/scores.js"></script>
    <script src="views/more.js"></script>
    <script src="views/staff.js"></script>
    <script src="views/reports.js"></script>
    <script src="views/settings.js"></script>
    <script src="views/tasks.js"></script>
</body>
</html>
