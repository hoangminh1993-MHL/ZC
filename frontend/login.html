<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - ZC Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#A10416',
                            cream: '#F6F0E2',
                            text: '#27221F',
                            green: '#22c55e',
                            orange: '#f97316',
                            error: '#ef4444'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-brand-cream text-brand-text min-h-screen flex items-center justify-center font-sans antialiased">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-gray-100 mx-4">
        <div class="text-center mb-8">
            <img src="/uploads/logo.jpg" alt="Zhuang's Cake Logo" class="w-24 h-24 mx-auto rounded-full object-cover mb-4 shadow-sm border border-brand-red/10">
            <h1 class="text-2xl font-bold tracking-tight text-brand-red">ZC Operations</h1>
            <p class="text-sm text-gray-500 mt-1">Hệ thống quản lý nội bộ</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-red focus:border-brand-red outline-none transition-all"
                    placeholder="Nhập tên đăng nhập...">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-red focus:border-brand-red outline-none transition-all"
                    placeholder="••••••••">
            </div>
            <div id="errorMsg" class="text-brand-error text-sm hidden font-medium text-center"></div>
            <button type="submit" id="loginBtn"
                class="w-full bg-brand-red hover:bg-red-800 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex justify-center items-center gap-2 shadow-md">
                Đăng nhập
            </button>
        </form>
        <div class="mt-6 text-center text-xs text-gray-400">
            &copy; 2026 Zhuang's Cake
        </div>
    </div>

    <script>
        // If already logged in, redirect
        if (localStorage.getItem('zc_token')) {
            window.location.href = '/frontend/index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Đang xử lý...`;
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('zc_token', data.token);
                    localStorage.setItem('zc_user', JSON.stringify(data.user));
                    window.location.href = '/frontend/index.html';
                } else {
                    errorMsg.textContent = data.message || "Đăng nhập thất bại";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = "Không thể kết nối đến máy chủ";
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Đăng nhập';
            }
        });
    </script>
</body>
</html>
